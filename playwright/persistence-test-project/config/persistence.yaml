# yaml-language-server: $schema=https://json-schema.axonivy.com/14.0-dev/config/persistence-2.json
Persistence:
  #Primary transactional database for core business operations
  CoreBusinessPU:
    DataSource: CoreDB
    Managed:
      Mode: PROJECT
      Classes:
        - persistence.test.project.AnotherVeryCoolEntity
    Properties:
      hibernate.hbm2ddl.auto: create-drop
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  #Read-optimized reporting and analytics database
  ReportingPU:
    DataSource: ReportingDB
    Managed:
      Mode: PROJECT
      Classes:
        - persistence.test.project.VeryCoolEntity
    Properties:
      hibernate.hbm2ddl.auto: org.hibernate.dialect.H2Dialect
      hibernate.connection.readOnly: create-drop
      hibernate.dialect: 'true'
